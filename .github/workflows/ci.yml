name: CI/CD Pipeline - Farmacia Hospital

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  issues: write
  actions: read
  security-events: write

env:
  PHP_VERSION: "8.3"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: login_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mysqli, pdo, pdo_mysql, xdebug
          tools: composer, phpunit

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run PHP Linting
        run: |
          find php diseño main/src test -name "*.php" -type f -exec php -l {} \;
        continue-on-error: true

      - name: Prepare JUnit results directory
        run: mkdir -p junit

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 -u root -proot login_db < test/database.sql

      - name: Run All Tests and Coverage
        run: vendor/bin/phpunit --configuration phpunit.xml --testdox --log-junit junit/results.xml --coverage-clover coverage.xml --coverage-html coverage-report
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASS: root
          DB_NAME: login_db

      - name: Upload PHPUnit results artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: junit/

      - name: Validate minimum coverage
        run: |
          THRESHOLD=0
          if [ ! -f coverage.xml ]; then
            echo "coverage.xml not found"
            exit 1
          fi
          COVERAGE=$(python3 -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); metrics = root.find('.//project/metrics') or root.find('.//metrics'); elements = float(metrics.attrib.get('elements', 0)) if metrics is not None else 0; covered = float(metrics.attrib.get('coveredelements', 0)) if metrics is not None else 0; print(int((covered/elements)*100) if elements > 0 else 0)")
          echo "Line coverage: ${COVERAGE}%"
          if [ "$COVERAGE" -lt "$THRESHOLD" ]; then
            echo "Coverage threshold too low: ${COVERAGE}% < ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-report/index.html
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: coverage-report/

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Composer validation
        run: composer validate

      - name: Check for security vulnerabilities with Composer
        run: composer audit
        continue-on-error: true

  codeql-analysis:
    name: Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'php'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  issue-management:
    name: Issue Management
    runs-on: ubuntu-latest
    needs: [build-and-test, code-quality, codeql-analysis]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create or update build/test failure issue
        if: ${{ needs.build-and-test.result == 'failure' }}
        uses: peter-evans/create-issue@v5
        with:
          title: CI build/test failure in ${{ github.repository }} on ${{ github.ref_name }}
          body: |
            ## Build/Test Failure

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Workflow:** ${{ github.workflow }}

            **Build and Test:** ${{ needs.build-and-test.result }}
            **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate the failing tests or errors in the build pipeline.
          labels: ci-failure, automation
          existing-issue: update
          issue-state: open
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update quality failure issue
        if: ${{ needs.code-quality.result == 'failure' }}
        uses: peter-evans/create-issue@v5
        with:
          title: Code quality failure in ${{ github.repository }} on ${{ github.ref_name }}
          body: |
            ## Code Quality Failure

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Workflow:** ${{ github.workflow }}

            **Code Quality:** ${{ needs.code-quality.result }}
            **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate the reported composer or code quality issues.
          labels: quality-failure, automation
          existing-issue: update
          issue-state: open
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update security failure issue
        if: ${{ needs.codeql-analysis.result == 'failure' }}
        uses: peter-evans/create-issue@v5
        with:
          title: Security analysis failure in ${{ github.repository }} on ${{ github.ref_name }}
          body: |
            ## Security Analysis Failure

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** `${{ github.sha }}`
            **Workflow:** ${{ github.workflow }}

            **Security Analysis:** ${{ needs.codeql-analysis.result }}
            **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate the CodeQL findings and fix any security issues.
          labels: security-failure, automation
          existing-issue: update
          issue-state: open
          token: ${{ secrets.GITHUB_TOKEN }}

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [build-and-test, code-quality, codeql-analysis]

    steps:
      - name: Download test results
        uses: actions/download-artifact@v5
        with:
          name: test-results
        continue-on-error: true

      - name: Download coverage reports
        uses: actions/download-artifact@v5
        with:
          name: coverage-reports
        continue-on-error: true

      - name: Summary of test execution
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            echo "## Test Execution Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo " **Unit Tests**: ${{ needs.build-and-test.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo " **Integration Tests**: ${{ needs.build-and-test.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo " **Functional Tests**: ${{ needs.build-and-test.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo " **NonFunctional Tests**: ${{ needs.build-and-test.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo " **Code Quality Checks**: ${{ needs.code-quality.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo " **Security Analysis**: ${{ needs.codeql-analysis.result }}" >> "$GITHUB_STEP_SUMMARY"
            echo " **Coverage Report**: downloaded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GITHUB_STEP_SUMMARY not available"
          fi
